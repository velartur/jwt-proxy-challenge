[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-proxy"
version = "1.0.0"
description = "Async HTTP proxy that signs a JWT (HS512) and appends it as the x-my-jwt header to upstream POST requests"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
]

[project.scripts]
jwt-proxy = "jwt_proxy.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
